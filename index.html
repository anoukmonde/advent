<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasman Advent Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: an explorer's atlas page. Parchment with a faint graticule, a compass rose, and 24 specimen plates laid out in a shuffled grid */
  --parchment: #e9dcbf;
  --parchment-deep: #d9c7a0;
  --plate: #f3e7cc;
  --sepia: #3b2a1a;
  --sepia-soft: #6b5238;
  --madder: #a8442f;
  --ochre: #c9962e;
  --olive: #6f7a45;
  --umber: #8a6240;
  --slate: #7d9aa0;
  --stone: #a39887;
  --font-display: "IM Fell English", "Times New Roman", Times, serif;
  --font-sc: "IM Fell English SC", "Times New Roman", Times, serif;
  --font-body: "EB Garamond", "Times New Roman", Times, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--parchment);
  background-image:
    radial-gradient(ellipse at 50% 40%, rgba(255,248,230,.55) 0%, rgba(255,248,230,0) 55%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(110,80,40,.28) 100%),
    repeating-linear-gradient(0deg, rgba(59,42,26,.07) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(59,42,26,.07) 0 1px, transparent 1px 64px);
  background-attachment: fixed;
  color: var(--sepia);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.55;
  min-height: 100%;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 22px 16px 48px; display: grid; gap: 22px; }
.crest { display: flex; align-items: center; justify-content: center; gap: 14px; }
.crest .rule { flex: 1; height: 7px; border-top: 1px solid var(--sepia-soft); border-bottom: 1px solid var(--sepia-soft); opacity: .7; }
.rose { width: 92px; height: 92px; cursor: pointer; border: 0; background: none; padding: 0; }
.rose:focus-visible { outline: 2px solid var(--sepia); outline-offset: 4px; border-radius: 50%; }
.rose svg { width: 100%; height: 100%; }
.preview-banner { justify-self: center; font-family: var(--font-sc); font-size: 15px; color: var(--plate); background: var(--madder); padding: 4px 14px; border-radius: 2px; letter-spacing: .04em; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 16px; } }

.door {
  position: relative; aspect-ratio: 3 / 4; border: 1px solid var(--sepia-soft); border-radius: 1px; cursor: pointer;
  background: var(--plate); color: var(--sepia); font-family: var(--font-display);
  display: grid; place-items: center; padding: 0; overflow: hidden;
  box-shadow: inset 0 0 0 4px var(--plate), inset 0 0 0 5px rgba(107,82,56,.55), 2px 3px 0 rgba(59,42,26,.18);
  background-image: radial-gradient(ellipse at 50% 45%, rgba(255,252,240,.7), rgba(255,252,240,0) 70%);
  transition: transform .2s ease;
}
.door::after { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 16px 16px 0; }
.door.nz::after { border-color: transparent var(--madder) transparent transparent; }
.door.au::after { border-color: transparent var(--ochre) transparent transparent; }
.door .num { font-size: clamp(28px, 7vw, 40px); font-style: italic; line-height: 1; }
.door.locked { background: #e2d3b2; color: #9a8669; cursor: default; box-shadow: inset 0 0 0 4px #e2d3b2, inset 0 0 0 5px rgba(107,82,56,.35); }
.door.locked .seal { position: absolute; bottom: 10px; left: 50%; width: 18px; height: 18px; margin-left: -9px; opacity: .75; }
.door.opened .mini { position: absolute; inset: 10px 6px 8px; }
.door.opened .mini svg { width: 100%; height: 100%; }
.door.opened .num { position: absolute; top: 8px; left: 9px; font-size: 17px; }
.door.today { box-shadow: inset 0 0 0 4px var(--plate), inset 0 0 0 5px var(--madder), 0 0 0 2px var(--madder), 2px 3px 0 rgba(59,42,26,.18); }
.door:not(.locked):hover { transform: rotate(-1.2deg) translateY(-2px); }
.door:focus-visible { outline: 2px solid var(--sepia); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .door.today:not(.opened) { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 4px var(--plate), inset 0 0 0 5px var(--madder), 0 0 0 6px rgba(168,68,47,.25), 2px 3px 0 rgba(59,42,26,.18); } }
}
.tail { display: flex; justify-content: center; }
.tail svg { width: 220px; height: 30px; }

/* Plate overlay */
.overlay { position: fixed; inset: 0; background: rgba(40,28,15,.6); display: none; align-items: flex-start; justify-content: center; padding: 22px 14px; overflow-y: auto; z-index: 10; }
.overlay.show { display: flex; }
.card { background: var(--plate); color: var(--sepia); max-width: 560px; width: 100%; padding: 14px; border-radius: 2px;
  background-image: radial-gradient(ellipse at 50% 30%, rgba(255,252,240,.8), rgba(255,252,240,0) 70%);
  box-shadow: 0 20px 40px rgba(30,20,10,.45); }
.card .frame { border: 1px solid var(--sepia-soft); outline: 1px solid var(--sepia-soft); outline-offset: 3px; padding: 14px 18px 20px; display: grid; gap: 12px; }
.plate-no { text-align: center; font-family: var(--font-sc); letter-spacing: .12em; font-size: 14px; color: var(--sepia-soft); }
.card .art svg { width: 100%; height: auto; max-height: 240px; display: block; }
.caption-unused { text-align: center; font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--sepia-soft); border-bottom: 1px solid rgba(107,82,56,.4); padding-bottom: 10px; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; text-align: center; }
.card p { margin: 0; max-width: 62ch; }
.card .body p:first-of-type::first-letter { font-family: var(--font-display); float: left; font-size: 3.1em; line-height: .8; padding: 6px 6px 0 0; color: var(--madder); }
.body { display: grid; gap: 10px; }
.watch { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--sepia); color: var(--plate); text-decoration: none; font-family: var(--font-sc); font-size: 17px; letter-spacing: .03em; padding: 8px 16px; border-radius: 2px; }
.btn:focus-visible, .alt:focus-visible, .close:focus-visible { outline: 2px solid var(--madder); outline-offset: 2px; }
.alt { color: var(--sepia-soft); font-size: 16px; font-style: italic; }
.close { justify-self: center; background: transparent; border: 1px solid var(--sepia); color: var(--sepia); font: 16px var(--font-sc); letter-spacing: .05em; padding: 6px 18px; border-radius: 2px; cursor: pointer; margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--sepia); color: var(--plate); padding: 10px 18px; border-radius: 2px; font-family: var(--font-display); font-style: italic; font-size: 17px; box-shadow: 0 8px 20px rgba(0,0,0,.3); display: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }

/* Sketch styles: sepia ink with faded watercolour washes */
.o { stroke: var(--sepia); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.n { fill: none; }
.r { fill: var(--madder); } .g { fill: var(--ochre); } .gr { fill: var(--olive); } .b { fill: var(--umber); }
.p { fill: #f8efd9; } .sd { fill: #dcc69a; } .gy { fill: var(--stone); } .i { fill: var(--sepia); }
.r, .g, .gr, .b, .gy, .sd { fill-opacity: .82; }
.thin { stroke-width: 1.6; }
.lbl { font-family: var(--font-display); font-style: italic; fill: var(--sepia); stroke: none; }

/* Mobile and touch */
body.modal-open { overflow: hidden; }
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: max(22px, env(safe-area-inset-top)); padding-bottom: max(48px, env(safe-area-inset-bottom)); }
.card { position: relative; }
.card p, .card h2 { overflow-wrap: break-word; }
.longname { hyphens: manual; font-style: italic; }
.x { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); box-shadow: 0 2px 6px rgba(40,28,15,.25); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--sepia-soft); background: var(--plate); color: var(--sepia); font: 26px/1 var(--font-display); cursor: pointer; z-index: 2; }
.x:focus-visible { outline: 2px solid var(--madder); outline-offset: 2px; }
.btn, .close { min-height: 44px; }
.alt { padding: 6px 0; display: inline-block; }
.song { padding: 0; }
@media (hover: none) { .door:not(.locked):hover { transform: none; } }
@media (max-width: 600px) {
  body { font-size: 17px; }
  .rose { width: 70px; height: 70px; }
  .grid { gap: 10px; }
  .door .num { font-size: 30px; }
  .overlay { padding: 0; }
  .card { border-radius: 0; min-height: 100%; padding: 10px 10px max(16px, env(safe-area-inset-bottom)); box-shadow: none; }
  .card .frame { padding: 12px 14px 18px; }
  .card h2 { font-size: 25px; }
  .card .art svg { max-height: 200px; }
  .watch { flex-direction: column; align-items: stretch; }
  .btn { justify-content: center; }
}
@media (max-width: 340px) { .grid { grid-template-columns: repeat(3, 1fr); } }
/* ---- Living sketches ---- */
[class*="a-"] { transform-box: fill-box; transform-origin: center; }
.a-uv, .a-eye-halo, .a-key, .a-laser { opacity: 0; }
.card.live .art .a-spin, body.chaos .door.opened .mini .a-spin { animation: spin 1.8s linear infinite; }
.card.live .art .a-spin-slow, body.chaos .door.opened .mini .a-spin-slow { animation: spin 12s linear infinite; }
.card.live .art .a-flap-l, body.chaos .door.opened .mini .a-flap-l { animation: flapL .5s ease-in-out infinite alternate; transform-origin:100% 50%; }
.card.live .art .a-flap-r, body.chaos .door.opened .mini .a-flap-r { animation: flapR .5s ease-in-out infinite alternate; transform-origin:0% 50%; }
.card.live .art .a-sway, body.chaos .door.opened .mini .a-sway { animation: sway 1.6s ease-in-out infinite alternate; }
.card.live .art .a-float, body.chaos .door.opened .mini .a-float { animation: float 2.6s ease-out infinite; }
.card.live .art .a-waddle, body.chaos .door.opened .mini .a-waddle { animation: waddle .5s ease-in-out infinite alternate; }
.card.live .art .a-tail, body.chaos .door.opened .mini .a-tail { animation: wag 1.1s ease-in-out infinite alternate; }
.card.live .art .a-uv, body.chaos .door.opened .mini .a-uv { animation: uv 4s ease-in-out infinite; }
.card.live .art .a-step, body.chaos .door.opened .mini .a-step { animation: step .5s ease-in-out infinite alternate; }
.card.live .art .a-bob, body.chaos .door.opened .mini .a-bob { animation: bob 1.4s ease-in-out infinite alternate; }
.card.live .art .a-twinkle, body.chaos .door.opened .mini .a-twinkle { animation: twinkle 1.2s ease-in-out infinite alternate; }
.card.live .art .a-unroll, body.chaos .door.opened .mini .a-unroll { animation: unroll 3s ease-in-out infinite alternate; }
.card.live .art .a-heat, body.chaos .door.opened .mini .a-heat { animation: heat 1.2s ease-in-out infinite alternate; }
.card.live .art .a-swing-lamp, body.chaos .door.opened .mini .a-swing-lamp { animation: sway 2s ease-in-out infinite alternate; }
.card.live .art .a-shimmer, body.chaos .door.opened .mini .a-shimmer { animation: shimmer 3s linear infinite; }
.card.live .art .a-breathe, body.chaos .door.opened .mini .a-breathe { animation: breathe 2s ease-in-out infinite alternate; }
.card.live .art .a-eye-halo, body.chaos .door.opened .mini .a-eye-halo { animation: eyehalo 2.4s ease-in-out infinite; }
.card.live .art .a-eye, body.chaos .door.opened .mini .a-eye { animation: eye 2.4s ease-in-out infinite; }
.card.live .art .a-pulse, body.chaos .door.opened .mini .a-pulse { animation: pulse 1.6s ease-in-out infinite alternate; }
.card.live .art .a-cackle, body.chaos .door.opened .mini .a-cackle { animation: cackle .9s ease-in-out infinite; }
.card.live .art .a-sprint, body.chaos .door.opened .mini .a-sprint { animation: sprint 3.4s ease-in-out infinite; }
.card.live .art .a-gallop, body.chaos .door.opened .mini .a-gallop { animation: gallop .22s ease-in-out infinite alternate; }
.card.live .art .a-leg, body.chaos .door.opened .mini .a-leg { animation: leg .22s ease-in-out infinite alternate; }
.card.live .art .a-speed, body.chaos .door.opened .mini .a-speed { animation: twinkle .3s linear infinite alternate; }
.card.live .art .a-hop, body.chaos .door.opened .mini .a-hop { animation: hop 1s ease-in-out infinite; }
.card.live .art .a-shake, body.chaos .door.opened .mini .a-shake { animation: shake .25s ease-in-out infinite alternate; }
.card.live .art .a-flapwing, body.chaos .door.opened .mini .a-flapwing { animation: flapwing .3s ease-in-out infinite alternate; }
.card.live .art .a-laser, body.chaos .door.opened .mini .a-laser { animation: laser .7s steps(2) infinite; }
.card.live .art .a-glow, body.chaos .door.opened .mini .a-glow { animation: glow 1.2s ease-in-out infinite alternate; }
.card.live .art .a-flicker, body.chaos .door.opened .mini .a-flicker { animation: flicker .5s linear infinite; }
.card.live .art .a-wave, body.chaos .door.opened .mini .a-wave { animation: wave 1.2s ease-out infinite; }
.card.live .art .a-swing, body.chaos .door.opened .mini .a-swing { animation: swing 1s ease-in-out infinite alternate; }
.card.live .art .a-wobble, body.chaos .door.opened .mini .a-wobble { animation: wobble 1.2s ease-in-out infinite alternate; }
.card.live .art .a-orbit, body.chaos .door.opened .mini .a-orbit { animation: spin 4s linear infinite; }
.card.live .art .a-nod, body.chaos .door.opened .mini .a-nod { animation: nod .8s ease-in-out infinite alternate; }
.card.live .art .a-draw, body.chaos .door.opened .mini .a-draw { animation: draw 3s ease-in-out infinite alternate; stroke-dasharray:300; }
.card.live .art .a-fade, body.chaos .door.opened .mini .a-fade { animation: fadein 3s ease-in-out infinite alternate; }
.card.live .art .a-key, body.chaos .door.opened .mini .a-key { animation: key 1.6s ease-in-out infinite; }
.card.live .art .a-collide-l, body.chaos .door.opened .mini .a-collide-l { animation: collideL 2.4s ease-in-out infinite; }
.card.live .art .a-collide-r, body.chaos .door.opened .mini .a-collide-r { animation: collideR 2.4s ease-in-out infinite; }
.card.live .art .a-flash, body.chaos .door.opened .mini .a-flash { animation: flash 2.4s ease-in-out infinite; }
.card.live .art .a-steam, body.chaos .door.opened .mini .a-steam { animation: steam 2.4s ease-out infinite; }
.card.live .art .a-ear, body.chaos .door.opened .mini .a-ear { animation: ear 3s ease-in-out infinite; }
.card.live .art .a-drop, body.chaos .door.opened .mini .a-drop { animation: drop 3.6s ease-in infinite; }
.card.live .art .a-lamp, body.chaos .door.opened .mini .a-lamp { animation: glow 1.6s ease-in-out infinite alternate; }
.card.live .art .d2, body.chaos .door.opened .mini .d2 { animation-delay: .4s; }
.card.live .art .d3, body.chaos .door.opened .mini .d3 { animation-delay: .8s; }
.card.live .art .d4, body.chaos .door.opened .mini .d4 { animation-delay: 1.2s; }
.card.live .art .a-float.d2, body.chaos .door.opened .mini .a-float.d2 { animation-delay: .9s; }
.card.live .art .a-float.d3, body.chaos .door.opened .mini .a-float.d3 { animation-delay: 1.7s; }
.card.live .art .d-half, body.chaos .door.opened .mini .d-half { animation-direction: alternate-reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flapL { to { transform: rotate(-16deg); } }
@keyframes flapR { to { transform: rotate(16deg); } }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes float { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-28px); opacity: 0; } }
@keyframes waddle { from { transform: rotate(-4deg) translateX(-4px); } to { transform: rotate(4deg) translateX(4px); } }
@keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
@keyframes uv { 0%, 30%, 100% { opacity: 0; } 55%, 75% { opacity: .6; } }
@keyframes step { to { transform: translateY(-4px); } }
@keyframes bob { to { transform: translateY(-6px); } }
@keyframes twinkle { from { opacity: 1; } to { opacity: .15; } }
@keyframes unroll { from { transform: scaleX(.9); } to { transform: scaleX(1); } }
@keyframes heat { from { transform: translateY(0); opacity: .2; } to { transform: translateY(-6px); opacity: .9; } }
@keyframes shimmer { 0%, 100% { fill: #7d9aa0; } 25% { fill: #6fe3d4; } 50% { fill: #c9962e; } 75% { fill: #a8442f; } }
@keyframes breathe { to { transform: scaleY(1.06); } }
@keyframes eyehalo { 0%, 100% { opacity: 0; } 50% { opacity: .7; } }
@keyframes eye { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
@keyframes pulse { to { transform: scale(1.12); } }
@keyframes cackle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 50% { transform: rotate(2deg); } 75% { transform: rotate(-10deg); } }
@keyframes sprint { 0%, 12% { transform: translateX(0); } 52% { transform: translateX(240px); } 52.01% { transform: translateX(-240px); } 88%, 100% { transform: translateX(0); } }
@keyframes gallop { to { transform: translateY(-4px); } }
@keyframes leg { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
@keyframes shake { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes flapwing { to { transform: rotate(-28deg); } }
@keyframes laser { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes glow { from { fill-opacity: .55; } to { fill-opacity: 1; } }
@keyframes flicker { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(.9, 1.14); } 50% { transform: scale(1.06, .9); } 75% { transform: scale(.94, 1.08); } }
@keyframes wave { 0% { opacity: 0; transform: translateX(-4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateX(6px); } }
@keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
@keyframes wobble { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@keyframes nod { to { transform: rotate(12deg); } }
@keyframes draw { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: .2; } to { opacity: 1; } }
@keyframes key { 0%, 100% { opacity: 0; } 30% { opacity: .9; } }
@keyframes collideL { 0%, 100% { transform: translateX(-12px); } 45%, 55% { transform: translateX(4px); } }
@keyframes collideR { 0%, 100% { transform: translateX(12px); } 45%, 55% { transform: translateX(-4px); } }
@keyframes flash { 0%, 40% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1.35); opacity: 1; } 70% { transform: scale(1); opacity: .8; } 100% { transform: scale(.2); opacity: 0; } }
@keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-14px); opacity: 0; } }
@keyframes ear { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-18deg); } 94% { transform: rotate(6deg); } }
@keyframes drop { 0% { transform: translateY(-90px); opacity: 0; } 10% { opacity: 1; } 30% { transform: translateY(0); } 36% { transform: translateY(-6px); } 42%, 100% { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .card.live .art *, body.chaos .door .mini * { animation: none !important; } }
.fig { font-family: "Courier Prime", "Courier New", Courier, monospace; font-size: 13px; color: var(--sepia-soft); text-align: center; min-height: 1.4em; letter-spacing: .02em; }
.fig .caret { display: inline-block; width: .55em; border-bottom: 2px solid var(--madder); margin-left: 1px; animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.player { position: relative; aspect-ratio: 16 / 9; width: 100%; background: var(--sepia); border: 1px solid var(--sepia-soft); }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
body.chaos .rose svg { animation: spin 3s linear infinite; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crest">
    <span class="rule"></span>
    <button class="rose" id="rose" type="button" aria-label="Compass rose">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#3b2a1a" stroke-width="1"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#3b2a1a" stroke-width=".6"/>
        <g stroke="#3b2a1a" stroke-width=".5">
          <line x1="50" y1="6" x2="50" y2="94"/><line x1="6" y1="50" x2="94" y2="50"/>
          <line x1="19" y1="19" x2="81" y2="81"/><line x1="81" y1="19" x2="19" y2="81"/>
        </g>
        <g stroke="#3b2a1a" stroke-width=".8" stroke-linejoin="round">
          <path d="M50 50 L44 30 L50 4 Z" fill="#3b2a1a"/><path d="M50 50 L56 30 L50 4 Z" fill="#f3e7cc"/>

    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="#c9962e"/>`;
  }
  return s;
}

// ---------- Unlock logic ----------
const YEAR = 2026;
let sessionPreview = false;
try { sessionPreview = sessionStorage.getItem("tasman-preview") === "1"; } catch (e) {}
const isPreview = () => location.hash === "#preview" || sessionPreview;
function unlockedUpTo(now) {
  if (isPreview()) return 24;
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  if (y > YEAR) return 24;
  if (y < YEAR || m < 11) return 0;
  return Math.min(d, 24);
}

let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem("tasman-opened") || "[]")); } catch (e) {}
function remember(day) {
  opened.add(day);
  try { localStorage.setItem("tasman-opened", JSON.stringify([...opened])); } catch (e) {}
}

const ORDER = [7,15,2,20,11,1,23,9,18,4,13,24,6,16,10,3,21,12,8,19,5,14,22,17];
const lockIcon = `<svg class="seal" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 l2 2.2 2.9-.6 .6 2.9 2.7 1.3 -1.2 2.7 1.2 2.7 -2.7 1.3 -.6 2.9 -2.9-.6 -2 2.2 -2-2.2 -2.9.6 -.6-2.9 -2.7-1.3 1.2-2.7 -1.2-2.7 2.7-1.3 .6-2.9 2.9.6z" fill="#a8442f"/><circle cx="10" cy="10" r="4" fill="none" stroke="#e2d3b2" stroke-width="1"/></svg>`;

function render() {
  const now = new Date();
  const upTo = unlockedUpTo(now);
  const today = (now.getFullYear() === YEAR && now.getMonth() === 11) ? now.getDate() : 0;
  document.getElementById("previewBanner").hidden = !isPreview();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  ORDER.forEach((day) => {
    const e = DAYS[day - 1];
    const b = document.createElement("button");
    const locked = day > upTo;
    b.className = `door ${e.c.toLowerCase()}`;
    b.type = "button";
    if (locked) {
      b.classList.add("locked");
      b.setAttribute("aria-label", `Door ${day}, opens on ${day} December`);
      b.innerHTML = `<span class="num">${day}</span>${lockIcon}`;
      b.addEventListener("click", () => toast(`Patience! Door ${day} opens on ${day} December.`));
    } else {
      if (day === today && !isPreview()) b.classList.add("today");
      if (opened.has(day)) {
        b.classList.add("opened");
        b.innerHTML = `<span class="mini">${SKETCH[day]}</span><span class="num">${day}</span>`;
      } else {
        b.innerHTML = `<span class="num">${day}</span>`;
      }
      b.setAttribute("aria-label", `Open door ${day}`);
      b.addEventListener("click", () => openCard(day, b));
    }
    grid.appendChild(b);
  });
}

let lastFocus = null;
function openCard(day, trigger) {
  const e = DAYS[day - 1];
  lastFocus = trigger;
  let video = "";
  if (e.video) {
    const where = e.video.where || "YouTube";
    const label = e.video.label || `Watch on ${where}`;
    const id = ytId(e.video.url);
    const song = e.video.song ? `<p class="alt song">${e.video.song}</p>` : "";
    const src = e.video.embedSrc || (id ? `https://www.youtube-nocookie.com/embed/${id}` : null);
    if (EMBED && src) {
      video = `<div class="player"><iframe src="${src}" title="${(e.video.label || e.video.song || e.title).replace(/"/g, "&quot;")}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>${song}
      <div class="watch"><a class="alt" href="${e.video.url}" target="_blank" rel="noopener">Open on YouTube</a><a class="alt" href="${ytSearch(e.video.q)}" target="_blank" rel="noopener">Not playing? Search YouTube</a></div>`;
    } else {
      video = `<div class="watch">
      <a class="btn" href="${e.video.url}" target="_blank" rel="noopener">${label}</a>
      <a class="alt" href="${ytSearch(e.video.q)}" target="_blank" rel="noopener">Not playing? Search YouTube</a>
    </div>${song}`;
    }
  }
  const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX", "XXI", "XXII", "XXIII", "XXIV"];
  document.getElementById("card").innerHTML = `
    <button class="x" type="button" id="xBtn" aria-label="Close">×</button>
    <div class="frame">
      <div class="plate-no">Plate ${ROMAN[day]} · ${day} December</div>
      <div class="art" title="Tap me">${SKETCH[day]}</div>
      <div class="fig" id="fig"></div>
      <h2 id="cardTitle">${e.title}</h2>
      <div class="body">${e.body.map((p) => `<p>${p}</p>`).join("")}</div>
      ${video}
      <button class="close" type="button" id="closeBtn">Close the plate</button>
    </div>`;
  const ov = document.getElementById("overlay");
  ov.classList.add("show");
  ov.scrollTop = 0;
  document.getElementById("closeBtn").focus();
  document.getElementById("closeBtn").addEventListener("click", closeCard);
  document.getElementById("xBtn").addEventListener("click", closeCard);
  document.body.classList.add("modal-open");
  const card = document.getElementById("card");
  card.classList.add("live");
  typeFig(FIG[day] || "");
  remember(day);
}
let figTimer;
function typeFig(text) {
  const el = document.getElementById("fig");
  clearInterval(figTimer);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = text; return; }
  let i = 0;
  el.innerHTML = '<span class="caret"></span>';
  figTimer = setInterval(() => {
    i++;
    el.innerHTML = `${text.slice(0, i)}<span class="caret"></span>`;
    if (i >= text.length) clearInterval(figTimer);
  }, 32);
}
function closeCard() {
  clearInterval(figTimer);
  document.getElementById("overlay").classList.remove("show");
  document.body.classList.remove("modal-open");
  render();
  if (lastFocus) {
    const label = lastFocus.getAttribute("aria-label");
    const again = [...document.querySelectorAll(".door")].find((d) => d.getAttribute("aria-label") === label);
    (again || document.querySelector(".door")).focus();
  }
}
document.getElementById("overlay").addEventListener("click", (ev) => { if (ev.target.id === "overlay") closeCard(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && document.getElementById("overlay").classList.contains("show")) closeCard(); });

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

let taps = 0, tapTimer;
document.getElementById("rose").addEventListener("click", () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 1500);
  if (taps >= 5) {
    taps = 0;
    sessionPreview = !sessionPreview;
    try { sessionStorage.setItem("tasman-preview", sessionPreview ? "1" : "0"); } catch (e) {}
    render();
  }
});
function toggleChaos() {
  const on = document.body.classList.toggle("chaos");
  toast(on ? "Chaos mode on. Science has gone too far." : "Chaos mode off. Order restored.");
}
const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
let kIdx = 0;
document.addEventListener("keydown", (ev) => {
  const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  kIdx = (k === KONAMI[kIdx]) ? kIdx + 1 : (k === KONAMI[0] ? 1 : 0);
  if (kIdx === KONAMI.length) { kIdx = 0; toggleChaos(); }
});
let pressTimer;
const roseEl = document.getElementById("rose");
roseEl.addEventListener("pointerdown", () => { pressTimer = setTimeout(() => { taps = 0; toggleChaos(); }, 800); });
["pointerup", "pointerleave", "pointercancel"].forEach((t) => roseEl.addEventListener(t, () => clearTimeout(pressTimer)));
roseEl.addEventListener("contextmenu", (ev) => ev.preventDefault());
try {
  console.log("%cKia ora, fellow nerd.", "font: italic 20px Georgia; color: #a8442f");
  console.log("%cSpecimens: 24. Seals: wax. Try ↑ ↑ ↓ ↓ ← → ← → B A, or hold the compass.", "font: 13px monospace; color: #3b2a1a");
} catch (e) {}
window.addEventListener("hashchange", render);
render();
// Refresh at midnight so a page left open unlocks the next door
let lastDate = new Date().toDateString();
setInterval(() => {
  const nowStr = new Date().toDateString();
  if (nowStr !== lastDate) { lastDate = nowStr; render(); }
}, 60000);
</script>
